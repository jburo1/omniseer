<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Physical-run inference and throughput comparison</title>
  <desc id="desc">Two-panel chart showing mean consumer throughput and RKNN inference p50 and p95 from one physical run per configuration.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; } .muted { fill: #58616f; } .small { font-size: 13px; } .label { font-size: 14px; } .value { font-size: 14px; font-weight: 650; }</style>
<text x="32" y="35" font-size="21" font-weight="700">Independent physical-run runtime observations</text>
<text x="32" y="57" class="muted small">One ROCK 5B+ closed-loop run per configuration</text>
<text x="152.0" y="81" class="value">Mean consumer throughput (FPS)</text>
<line x1="152.0" y1="105" x2="152.0" y2="364" stroke="#d8dde6"/>
<text x="152.0" y="402" text-anchor="middle" class="muted small">0</text>
<line x1="229.4" y1="105" x2="229.4" y2="364" stroke="#d8dde6"/>
<text x="229.4" y="402" text-anchor="middle" class="muted small">4</text>
<line x1="306.9" y1="105" x2="306.9" y2="364" stroke="#d8dde6"/>
<text x="306.9" y="402" text-anchor="middle" class="muted small">8</text>
<line x1="384.3" y1="105" x2="384.3" y2="364" stroke="#d8dde6"/>
<text x="384.3" y="402" text-anchor="middle" class="muted small">12</text>
<line x1="461.8" y1="105" x2="461.8" y2="364" stroke="#d8dde6"/>
<text x="461.8" y="402" text-anchor="middle" class="muted small">16</text>
<text x="140.0" y="128.0" text-anchor="end" class="label">v2-S FP</text>
<rect x="152.0" y="110.0" width="153.0" height="25" rx="3" fill="#4057a5"/>
<text x="313.0" y="128.0" class="value">7.90</text>
<text x="140.0" y="171.2" text-anchor="end" class="label">v2-S INT8</text>
<rect x="152.0" y="153.2" width="320.2" height="25" rx="3" fill="#216b4f"/>
<text x="480.2" y="171.2" class="value">16.54</text>
<text x="140.0" y="214.3" text-anchor="end" class="label">v2-M FP</text>
<rect x="152.0" y="196.3" width="84.6" height="25" rx="3" fill="#4057a5"/>
<text x="244.6" y="214.3" class="value">4.37</text>
<text x="140.0" y="257.5" text-anchor="end" class="label">v2-M INT8</text>
<rect x="152.0" y="239.5" width="194.4" height="25" rx="3" fill="#a76416"/>
<text x="354.4" y="257.5" class="value">10.04</text>
<text x="140.0" y="300.7" text-anchor="end" class="label">v2-L FP</text>
<rect x="152.0" y="282.7" width="51.1" height="25" rx="3" fill="#4057a5"/>
<text x="211.1" y="300.7" class="value">2.64</text>
<text x="140.0" y="343.8" text-anchor="end" class="label">v2-L Hybrid</text>
<rect x="152.0" y="325.8" width="90.0" height="25" rx="3" fill="#4057a5"/>
<text x="250.0" y="343.8" class="value">4.65</text>
<text x="556.5" y="81" class="value">RKNN inference p50 / p95 (ms)</text>
<line x1="556.5" y1="105" x2="556.5" y2="364" stroke="#d8dde6"/>
<text x="556.5" y="402" text-anchor="middle" class="muted small">0</text>
<line x1="633.9" y1="105" x2="633.9" y2="364" stroke="#d8dde6"/>
<text x="633.9" y="402" text-anchor="middle" class="muted small">100</text>
<line x1="711.4" y1="105" x2="711.4" y2="364" stroke="#d8dde6"/>
<text x="711.4" y="402" text-anchor="middle" class="muted small">200</text>
<line x1="788.8" y1="105" x2="788.8" y2="364" stroke="#d8dde6"/>
<text x="788.8" y="402" text-anchor="middle" class="muted small">300</text>
<line x1="866.3" y1="105" x2="866.3" y2="364" stroke="#d8dde6"/>
<text x="866.3" y="402" text-anchor="middle" class="muted small">400</text>
