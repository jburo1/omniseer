<rect x="556.5" y="196.3" width="174.3" height="25" rx="3" fill="#4057a5"/>
<text x="759.2" y="214.3" class="value">225 / 251</text>
<rect x="556.5" y="239.5" width="82.5" height="25" rx="3" fill="#c8d1f1"/>
<rect x="556.5" y="239.5" width="74.5" height="25" rx="3" fill="#4057a5"/>
<text x="647.0" y="257.5" class="value">96 / 106</text>
<rect x="556.5" y="282.7" width="310.5" height="25" rx="3" fill="#c8d1f1"/>
<rect x="556.5" y="282.7" width="294.5" height="25" rx="3" fill="#4057a5"/>
<text x="875.0" y="300.7" class="value">380 / 401</text>
<rect x="556.5" y="325.8" width="178.0" height="25" rx="3" fill="#c8d1f1"/>
<rect x="556.5" y="325.8" width="159.2" height="25" rx="3" fill="#4057a5"/>
<text x="742.5" y="343.8" class="value">206 / 230</text>
<rect x="700" y="372" width="14" height="14" fill="#4057a5"/><text x="720" y="384" class="muted small">p50</text>
<rect x="780" y="372" width="14" height="14" fill="#c8d1f1"/><text x="800" y="384" class="muted small">p95</text>
</svg>
