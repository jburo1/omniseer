# ekf_fusion_real.yaml
# Robot Localization EKF for real hardware wheel encoders + IMU only.
ekf_filter:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_timeout: 0.1
    publish_tf: true
    print_diagnostics: true
    debug: false
    debug_out_file: /tmp/ekf_debug.txt

    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /mecanum_drive_controller/odometry
    odom0_queue_size: 5
    odom0_nodelay: true
    odom0_config:
      [ false, false, false,
        false, false, false,
        true, true, false,
        false, false, false,
        false, false, false ]

    imu0: /imu
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_config:
      [ false, false, false,
        false, false, false,
        false, false, false,
        false, false, true,
        false, false, false ]

    # Kilted robot_localization accepts a 15-element diagonal in state order:
    # x, y, z [m^2]; roll, pitch, yaw [rad^2]; vx, vy, vz [(m/s)^2];
    # vroll, vpitch, vyaw [(rad/s)^2]; ax, ay, az [(m/s^2)^2].
    #
    # Each EKF prediction adds this process covariance. x/y and yaw permit
    # 1 mm and 0.057 deg RMS unmodelled change per 20 Hz prediction; vx/vy
    # and vyaw use conservative commissioning-v2 experimental allowances.
    # These are model error/slip allowances, not calibrated ground truth or
    # sensor measurements.
    # The constrained 2D states retain small positive variances so the
    # covariance remains well-conditioned.
    process_noise_covariance:
      [ 1.0e-6, 1.0e-6, 1.0e-6,
        1.0e-6, 1.0e-6, 1.0e-6,
        0.02, 0.02, 1.0e-6,
        1.0e-6, 1.0e-6, 0.001,
        1.0e-3, 1.0e-3, 1.0e-6 ]

    # The robot is placed at the local odom origin before startup. Use a
    # 2 cm RMS placement uncertainty, 2 deg RMS initial heading uncertainty,
    # and stationary-but-not-exactly-known initial velocity/rate. This is a
    # prior, not a claim about encoder or IMU measurement noise.
    initial_estimate_covariance:
      [ 4.0e-4, 4.0e-4, 1.0e-6,
        1.0e-6, 1.0e-6, 1.2e-3,
        2.5e-3, 2.5e-3, 1.0e-6,
        1.0e-6, 1.0e-6, 4.0e-4,
        1.0e-2, 1.0e-2, 1.0e-6 ]
