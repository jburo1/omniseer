site_name: Omniseer
site_description: Physical edge-AI robotics for open-vocabulary perception, bounded behavior, and reproducible evidence
site_url: https://jburo1.github.io/omniseer/
repo_url: https://github.com/jburo1/omniseer
repo_name: jburo1/omniseer
exclude_docs: |
  img/**
  diagrams/README.md
  diagrams/explorer/README.md
  diagrams/**/*.d2
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.instant
extra:
  social_image: assets/brand/social-preview.png
markdown_extensions:
  - attr_list
  - md_in_html
  - meta
  - toc:
      permalink: true
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.superfences
extra_javascript:
  - assets/js/collapse-sidebar.js
hooks:
  - scripts/docs/copy_public_runbundle.py
plugins:
  - search
  - git-revision-date-localized
  - redirects:
      redirect_maps:
        perception/edge-to-cloud.md: perception/runtime-overview.md
nav:
  - Home: index.md
  - Experiments:
    - Target Acquisition: verification/target-acquisition.md
    - Detector Comparison: verification/detector-comparison.md
    - INT8 Quantization Failure: verification/int8-quantization-failure.md
  - Perception & Models:
    - Vision Pipeline: perception/vision-pipeline.md
    - Vision Telemetry: perception/vision-telemetry.md
    - YOLO-World Model Deployment: perception/yolo-world-model-deployment.md
    - INT8 Quantization Technical Appendix: perception/int8-quantization-investigation.md
  - Robot Runtime:
    - Runtime Overview: perception/runtime-overview.md
    - ROS / Sim-Real Interfaces: robot-runtime/ros-packages.md
    - Runtime Container: robot-runtime/robot-runtime-container.md
  - Operator & Evidence:
    - Operator Workflow: operations/operator-run-workflow.md
    - Robot Gateway: gateway/robot-gateway.md
    - Gateway API: gateway/gateway-api.md
    - Preview Streaming: gateway/preview-streaming.md
    - Verification Evidence: verification/evidence.md
  - Firmware & Hardware:
    - Firmware & Robot I/O: firmware/overview.md
    - Electrical System: hardware/electrical-system.md
    - Bill of Materials: hardware/bill-of-materials.md
  - Engineering:
    - Developer CLI: operations/scripts-frontdoor.md
    - CI/CD Overview: verification/ci-cd.md
