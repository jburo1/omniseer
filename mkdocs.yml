site_name: omniseer
repo_url: https://github.com/jburo1/omniseer
exclude_docs: |
  diagrams/**/*.d2
theme:
  name: material
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.instant
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
plugins:
  - search
  - git-revision-date-localized
nav:
  - Home: index.md
  - Architecture:
    - Overview: architecture/overview.md
    - Diagrams: diagrams/README.md
    - Explorer: diagrams/explorer/README.md
  - Operations:
    - Scripts front door: operations/scripts-frontdoor.md
    - Operator run workflow: operations/operator-run-workflow.md
    - Real teleop + native perception check: operations/real-teleop-perception-check.md
    - Operator-integrated real demo: operations/operator-integrated-demo.md
  - Robot Runtime:
    - ROS packages: robot-runtime/ros-packages.md
    - Robot runtime container: robot-runtime/robot-runtime-container.md
  - Perception:
    - Edge-to-cloud perception: perception/edge-to-cloud.md
    - Vision pipeline: perception/vision-pipeline.md
    - Producer pipeline: perception/producer-pipeline.md
    - Consumer pipeline: perception/consumer-pipeline.md
    - Vision telemetry: perception/vision-telemetry.md
  - Gateway:
    - Robot gateway: gateway/robot-gateway.md
    - Gateway API: gateway/gateway-api.md
    - Preview streaming: gateway/preview-streaming.md
    - Remote monitoring architecture: gateway/remote-monitoring-architecture.md
  - Verification:
    - Evidence: verification/evidence.md
    - Build pipeline: verification/build-pipeline.md
    - CI/CD overview: verification/ci-cd.md
    - Code documentation: verification/code-documentation.md
  - Hardware:
    - Circuit: hardware/circuit.md
    - Wiring guide: hardware/wiring.md
