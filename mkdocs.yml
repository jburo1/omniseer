site_name: Omniseer
site_description: Edge-to-cloud ROS 2 robot for open-vocabulary perception and reproducible edge-AI experiments
site_url: https://jburo1.github.io/omniseer/
repo_url: https://github.com/jburo1/omniseer
repo_name: jburo1/omniseer
exclude_docs: |
  diagrams/README.md
  diagrams/explorer/README.md
  diagrams/**/*.d2
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/brand/logo.svg
  favicon: assets/brand/favicon.svg
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.instant
extra:
  social_image: assets/brand/social-preview.png
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
extra_javascript:
  - assets/js/collapse-sidebar.js
plugins:
  - search
  - git-revision-date-localized
nav:
  - Home: index.md
  - Project:
    - System Architecture: architecture/overview.md
    - Edge Perception and Offboard Review: perception/edge-to-cloud.md
    - Hardware:
      - Electrical System: hardware/electrical-system.md
      - Bill of Materials: hardware/bill-of-materials.md
    - Verification Evidence: verification/evidence.md
  - Operate:
    - Scripts Front Door: operations/scripts-frontdoor.md
    - Operator Run Workflow: operations/operator-run-workflow.md
    - Robot Runtime Container: robot-runtime/robot-runtime-container.md
  - Subsystems:
    - ROS Packages and Sim/Real Boundary: robot-runtime/ros-packages.md
    - Firmware & Robot I/O: firmware/overview.md
    - Vision Pipeline: perception/vision-pipeline.md
    - Vision Telemetry: perception/vision-telemetry.md
    - Robot Gateway: gateway/robot-gateway.md
    - Gateway API: gateway/gateway-api.md
    - Preview Streaming: gateway/preview-streaming.md
  - Verification:
    - CI/CD Overview: verification/ci-cd.md
