name: docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/docs/**"
      - "studies/autonomy/v2l_fp_target_acquisition/run/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install D2
        shell: bash
        run: |
          set -eux
          curl -fsSL -o /tmp/d2.tar.gz \
            "https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz"
          mkdir -p /tmp/d2
          tar -xzf /tmp/d2.tar.gz -C /tmp/d2 --strip-components=1
          sudo make -sC /tmp/d2 install PREFIX=/usr/local
          d2 --version
          rm -rf /tmp/d2 /tmp/d2.tar.gz

      - name: Build docs
        shell: bash
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            mkdocs-material \
            mkdocs-git-revision-date-localized-plugin
          scripts/omni docs build

      - name: Configure git
        shell: bash
        run: |
          set -eux
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Deploy docs
        shell: bash
        run: |
          set -eux
          mkdocs gh-deploy --clean --force --verbose
