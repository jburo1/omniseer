name: ci

on:
  push:
    branches: [master]
    paths:
      - "ros_ws/**"
      - "vision/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "pytest.ini"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROS_DISTRO: kilted

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install lint deps
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          python3 -m venv /opt/lint-venv
          /opt/lint-venv/bin/python -m pip install --upgrade pip
          /opt/lint-venv/bin/python -m pip install --no-cache-dir pre-commit==4.3.0

      - name: Pre-commit hooks
        shell: bash
        run: |
          set -eux
          /opt/lint-venv/bin/pre-commit run --all-files --show-diff-on-failure

      - name: Shellcheck
        shell: bash
        run: |
          set -eux
          mapfile -t shell_files < <(git ls-files '*.sh' scripts/omni)
          shellcheck -S error -x "${shell_files[@]}"

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository tests
        shell: bash
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest==7.4.4
          python3 -m pytest -q tests

  ros:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:kilted-desktop-full-noble
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4

      - name: Install ROS workspace deps
        shell: bash
        run: |
          set -eux
          bash scripts/ci/install_ros_workspace_deps.sh \
            ros_ws/src/omniseer_gz_assets \
            ros_ws/src/omniseer_msgs \
            ros_ws/src/yolo_ros/yolo_msgs \
            ros_ws/src/omniseer_autonomy \
            ros_ws/src/omniseer_description \
            ros_ws/src/analysis \
            ros_ws/src/omniseer_experiments \
            ros_ws/src/bringup \
            ros_ws/src/robot_io_adapters \
            ros_ws/src/robot_diag_control \
            ros_ws/src/robot_diag_control_cpp

      - name: Build ROS packages
        shell: bash
        run: |
          set -eux
          set +u
          # shellcheck disable=SC1090
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          cd ros_ws
          colcon build --merge-install \
            --packages-ignore rf2o_laser_odometry yolo_bringup yolo_ros \
            --packages-select \
              omniseer_gz_assets \
              omniseer_msgs \
              yolo_msgs \
              omniseer_autonomy \
              omniseer_description \
              analysis \
              omniseer_experiments \
              bringup \
              robot_io_adapters \
              robot_diag_control \
              robot_diag_control_cpp

      - name: Test ROS packages
        shell: bash
        run: |
          set -eux
          set +u
          # shellcheck disable=SC1090
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          cd ros_ws
          set +u
          # shellcheck disable=SC1091
          source install/setup.bash
          set -u
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            colcon test --merge-install \
            --packages-ignore rf2o_laser_odometry yolo_bringup yolo_ros \
            --packages-select \
              omniseer_autonomy \
              omniseer_description \
              analysis \
              omniseer_experiments \
              bringup \
              robot_io_adapters \
              robot_diag_control \
              robot_diag_control_cpp
          colcon test-result --all --verbose

      - name: Run simulation bringup smoke test
        shell: bash
        env:
          OMNISEER_RUN_SIM_SMOKE: "1"
          OMNISEER_SMOKE_LOG_PATH: ${{ github.workspace }}/ros_ws/log/bringup_smoke/sim.launch.log
        run: |
          set -eux
          mkdir -p "$(dirname "${OMNISEER_SMOKE_LOG_PATH}")"
          set +u
          # shellcheck disable=SC1090
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          cd ros_ws
          set +u
          # shellcheck disable=SC1091
          source install/setup.bash
          set -u
          python3 -m pytest -vv -s src/bringup/test/test_sim_launch_smoke.py

      - name: Upload ROS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros-logs
          if-no-files-found: ignore
          path: |
            ros_ws/log
            ros_ws/build/*/test_results
            ros_ws/build/*/Testing/Temporary

  vision-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install host vision test deps
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            libgtest-dev \
            make

      - name: Build host vision tests
        shell: bash
        run: |
          set -eux
          cmake -S vision -B vision/build-ci -DVISION_BUILD_HARNESS=OFF
          cmake --build vision/build-ci \
            --target image_buffer_pool_test jsonl_telemetry_test rolling_telemetry_test

      - name: Run host vision tests
        shell: bash
        run: |
          set -eux
          ctest --test-dir vision/build-ci \
            -R 'image_buffer_pool_test|jsonl_telemetry_test|rolling_telemetry_test' \
            --output-on-failure

      - name: Upload vision logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vision-host-logs
          if-no-files-found: ignore
          path: |
            vision/build-ci/Testing/Temporary
            vision/build-ci/CMakeFiles/CMakeOutput.log
            vision/build-ci/CMakeFiles/CMakeError.log
