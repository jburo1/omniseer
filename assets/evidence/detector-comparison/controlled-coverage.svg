<svg xmlns="http://www.w3.org/2000/svg" width="960" height="355" viewBox="0 0 960 355" role="img" aria-labelledby="title desc">
  <title id="title">Controlled visible class-frame coverage by configuration</title>
  <desc id="desc">Bar chart of visible class-frame coverage across six configurations. v2-M FP leads at 41.7 percent.</desc>
  <rect width="100%" height="100%" fill="white"/>
  <style>text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; } .muted { fill: #58616f; } .small { font-size: 13px; } .label { font-size: 14px; } .value { font-size: 14px; font-weight: 650; }</style>
<text x="32" y="35" font-size="21" font-weight="700">Controlled visible class-frame coverage</text>
<text x="32" y="57" class="muted small">Same 1,222 source frames; 5,679 class-frame opportunities per configuration</text>
<line x1="160.0" y1="72" x2="160.0" y2="297" stroke="#d8dde6"/>
<text x="160.0" y="330" text-anchor="middle" class="muted small">0%</text>
<line x1="322.2" y1="72" x2="322.2" y2="297" stroke="#d8dde6"/>
<text x="322.2" y="330" text-anchor="middle" class="muted small">10%</text>
<line x1="484.4" y1="72" x2="484.4" y2="297" stroke="#d8dde6"/>
<text x="484.4" y="330" text-anchor="middle" class="muted small">20%</text>
<line x1="646.7" y1="72" x2="646.7" y2="297" stroke="#d8dde6"/>
<text x="646.7" y="330" text-anchor="middle" class="muted small">30%</text>
<line x1="808.9" y1="72" x2="808.9" y2="297" stroke="#d8dde6"/>
<text x="808.9" y="330" text-anchor="middle" class="muted small">40%</text>
<text x="146" y="98.0" text-anchor="end" class="label">v2-S FP</text>
<rect x="160" y="78.0" width="607.3" height="28" rx="3" fill="#4057a5"/>
<text x="776.3" y="98.0" class="value">37.4%</text>
<text x="146" y="135.5" text-anchor="end" class="label">v2-S INT8</text>
<rect x="160" y="115.5" width="529.3" height="28" rx="3" fill="#4057a5"/>
